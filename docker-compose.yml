services:
  kush:
    build: .
    container_name: kush
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./server/uploads:/app/server/uploads
      - ./server/logs:/app/server/logs
      - ./public:/app/public
      - ./server:/app/server
      - ./kush.apk:/app/kush.apk:ro
      - ./saksogan.apk:/app/saksogan.apk:ro
      - ./aura-lan.apk:/app/aura-lan.apk:ro
    environment:
      - PORT=8088
      - NODE_ENV=production
