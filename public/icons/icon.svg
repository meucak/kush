<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#003e82" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Apple Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Outer Orbit -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="20" stroke-opacity="0.3" stroke-dasharray="16 12"/>
  
  <!-- Central Glowing Node -->
  <circle cx="256" cy="256" r="70" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="48" fill="#0a84ff"/>
  
  <!-- Peer Satellites -->
  <circle cx="256" cy="116" r="28" fill="#ffffff"/>
  <circle cx="377" cy="326" r="28" fill="#ffffff"/>
  <circle cx="135" cy="326" r="28" fill="#ffffff"/>
</svg>
